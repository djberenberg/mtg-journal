<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game journal</title>
<meta name="description" content="A journal for a game of Magic: the board in front of you, turn by turn.">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>&#9679;</text></svg>">
</head>
<body>
<main class="journal" id="journal">

  <header class="bar">
    <nav class="navbar" id="navbar" aria-label="Actions">
      <button type="button" class="menu-btn" id="menu-game" aria-haspopup="menu" aria-expanded="false">game</button>
      <button type="button" class="menu-btn" id="menu-card" aria-haspopup="menu" aria-expanded="false" disabled>card</button>
    </nav>
    <form class="search" id="search" autocomplete="off">
      <div class="field">
        <input id="q" type="text" placeholder="card name" aria-label="Card name" aria-autocomplete="list" aria-controls="suggest" spellcheck="false">
        <ul class="suggest" id="suggest" role="listbox" hidden></ul>
      </div>
      <button type="submit" id="add-me" title="Add to my hand (enter)">to my hand</button>
      <button type="button" id="add-opp" title="The opponent shown plays it (shift+enter)">opponent plays</button>
    </form>
    <div class="turnbar">
      <span class="turn" id="turn">turn 1 · my turn</span>
      <button type="button" id="next">next turn</button>
      <button type="button" id="undo" disabled>undo</button>
      <button type="button" id="log-toggle" aria-expanded="true" aria-controls="log-panel">log</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </header>

  <div class="table">
    <section class="side" data-owner="opp">
      <div class="tabs" id="opp-tabs" role="tablist" aria-label="Opponents" hidden></div>
      <h2>
        <span class="who" id="opp-name">opponent</span>
        <span class="life" role="group" aria-label="This opponent's life">
          <button type="button" data-life="opp" data-by="-5">-5</button>
          <button type="button" data-life="opp" data-by="-1">-1</button>
          <output id="life-opp" aria-label="Life total">20</output>
          <button type="button" data-life="opp" data-by="1">+1</button>
          <button type="button" data-life="opp" data-by="5">+5</button>
        </span>
      </h2>
      <div class="zone battlefield" data-owner="opp" data-zone="battlefield" aria-label="Opponent's battlefield">
        <div class="tier" data-tier="lands" aria-label="Opponent's lands"></div>
        <div class="tier" data-tier="spells" aria-label="Opponent's other permanents"></div>
      </div>
      <div class="piles">
        <div class="pile"><h3>command <span class="count" data-count="opp:command">0</span></h3><div class="zone" data-owner="opp" data-zone="command" aria-label="Opponent's command zone"></div></div>
        <div class="pile"><h3>graveyard <span class="count" data-count="opp:graveyard">0</span></h3><div class="zone" data-owner="opp" data-zone="graveyard" aria-label="Opponent's graveyard"></div></div>
        <div class="pile"><h3>exile <span class="count" data-count="opp:exile">0</span></h3><div class="zone" data-owner="opp" data-zone="exile" aria-label="Opponent's exile"></div></div>
        <div class="pile" data-pile="opp:hand"><h3>hand <span class="count" data-count="opp:hand">0</span></h3><div class="zone" data-owner="opp" data-zone="hand" aria-label="Opponent's hand"></div></div>
      </div>
    </section>

    <section class="side" data-owner="me">
      <h2>
        <span class="who">me</span>
        <span class="life" role="group" aria-label="My life">
          <button type="button" data-life="me" data-by="-5">-5</button>
          <button type="button" data-life="me" data-by="-1">-1</button>
          <output id="life-me" aria-label="My life total">20</output>
          <button type="button" data-life="me" data-by="1">+1</button>
          <button type="button" data-life="me" data-by="5">+5</button>
        </span>
      </h2>
      <div class="zone battlefield" data-owner="me" data-zone="battlefield" aria-label="My battlefield">
        <div class="tier" data-tier="spells" aria-label="My other permanents"></div>
        <div class="tier" data-tier="lands" aria-label="My lands"></div>
      </div>
      <div class="piles">
        <div class="pile"><h3>command <span class="count" data-count="me:command">0</span></h3><div class="zone" data-owner="me" data-zone="command" aria-label="My command zone"></div></div>
        <div class="pile"><h3>graveyard <span class="count" data-count="me:graveyard">0</span></h3><div class="zone" data-owner="me" data-zone="graveyard" aria-label="My graveyard"></div></div>
        <div class="pile"><h3>exile <span class="count" data-count="me:exile">0</span></h3><div class="zone" data-owner="me" data-zone="exile" aria-label="My exile"></div></div>
      </div>
      <h3>hand <span class="count" data-count="me:hand">0</span></h3>
      <div class="zone hand" data-owner="me" data-zone="hand" aria-label="My hand"></div>
    </section>
  </div>

  <aside class="journal-log" id="log-panel">
    <ol id="log" reversed aria-label="Log"></ol>
  </aside>

  <!-- Moved onto whichever card asked for a counter; one for the page. -->
  <form class="ctr-pick" id="ctr-pick" hidden>
    <input id="ctr-kind" type="text" value="+1/+1" maxlength="16" aria-label="Counter: +N/+M, or a name such as lore" spellcheck="false">
    <button type="submit" class="primary">add</button>
  </form>

  <!-- Filled and placed wherever a menu was asked for; one for the page. -->
  <div class="menu" id="menu" role="menu" hidden></div>

  <!-- What the card under the pointer says. The card already carries its
       own name and zone as a label, so this repeats it: decoration. -->
  <div class="peek" id="peek" hidden aria-hidden="true"></div>

  <dialog id="new-dialog" aria-labelledby="new-title">
    <form id="new-form">
      <h2 id="new-title">new game</h2>
      <fieldset>
        <legend>opponents</legend>
        <label><input type="radio" name="opponents" value="1" checked> 1</label>
        <label><input type="radio" name="opponents" value="2"> 2</label>
        <label><input type="radio" name="opponents" value="3"> 3</label>
      </fieldset>
      <fieldset>
        <legend>starting life</legend>
        <label><input type="radio" name="life" value="20" checked> 20</label>
        <label><input type="radio" name="life" value="40"> 40</label>
      </fieldset>
      <p class="warn" id="new-warn" hidden>the game on the table is cleared</p>
      <div class="buttons">
        <button type="button" id="new-cancel">cancel</button>
        <button type="submit" class="primary">start</button>
      </div>
    </form>
  </dialog>

</main>
<script type="module" src="app.js"></script>
</body>
</html>
